{# Reusable section heading. Params: eyebrow, title, highlight, subtitle #}
<header class="section-header reveal">
  <span class="eyebrow"><span class="eyebrow__dot"></span>{{ eyebrow }}</span>
  <h2 class="section-title">{{ title }} <span class="text-gradient">{{ highlight }}</span></h2>
  {% if subtitle %}<p class="section-subtitle">{{ subtitle }}</p>{% endif %}
</header>
