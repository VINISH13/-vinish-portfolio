<div class="socials">
  {% if profile.github_url %}<a class="icon-btn" href="{{ profile.github_url }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="bi bi-github"></i></a>{% endif %}
  {% if profile.linkedin_url %}<a class="icon-btn" href="{{ profile.linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>{% endif %}
  {% if profile.twitter_url %}<a class="icon-btn" href="{{ profile.twitter_url }}" target="_blank" rel="noopener" aria-label="X / Twitter"><i class="bi bi-twitter-x"></i></a>{% endif %}
  {% if profile.email %}<a class="icon-btn" href="mailto:{{ profile.email }}" aria-label="Email"><i class="bi bi-envelope"></i></a>{% endif %}
</div>
