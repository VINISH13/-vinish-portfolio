{# Reusable social icon row. Optional: extra_class #}
<div class="social-links {{ extra_class }}">
  {% if profile.github_url %}<a href="{{ profile.github_url }}" target="_blank" rel="noopener" aria-label="GitHub" data-tip="GitHub"><i class="bi bi-github"></i></a>{% endif %}
  {% if profile.linkedin_url %}<a href="{{ profile.linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn" data-tip="LinkedIn"><i class="bi bi-linkedin"></i></a>{% endif %}
  {% if profile.twitter_url %}<a href="{{ profile.twitter_url }}" target="_blank" rel="noopener" aria-label="X / Twitter" data-tip="X"><i class="bi bi-twitter-x"></i></a>{% endif %}
  {% if profile.website_url %}<a href="{{ profile.website_url }}" target="_blank" rel="noopener" aria-label="Website" data-tip="Website"><i class="bi bi-globe2"></i></a>{% endif %}
  {% if profile.email %}<a href="mailto:{{ profile.email }}" aria-label="Email" data-tip="Email"><i class="bi bi-envelope-fill"></i></a>{% endif %}
</div>
