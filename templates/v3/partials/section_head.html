{# Params: num, label, title, highlight #}
<header class="sec reveal">
  <span class="sec__kicker" data-scramble>// {{ num }} — {{ label|upper }}</span>
  <h2 class="sec__title">{{ title }} <span class="holo">{{ highlight }}</span></h2>
  <span class="sec__line" aria-hidden="true"></span>
</header>
